name: MLflow CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: apple-quality-mlflow
          environment-file: MLProject/conda.yaml
          auto-activate-base: false

      - name: Verify Environment
        shell: bash -el {0}
        run: |
          python --version
          conda info
          pip list

      - name: Run MLflow Project
        shell: bash -el {0}
        run: |
          cd MLProject
          mlflow run . --env-manager local

      - name: Upload Training Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            MLProject/artifacts
            MLProject/mlruns
          if-no-files-found: warn

      - name: Upload To Google Drive
        shell: bash -el {0}
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          cd MLProject
          python upload_to_drive.py

      - name: Get Latest MLflow Run ID
        shell: bash -el {0}
        run: |

          cd MLProject

          RUN_ID=$(find mlruns -mindepth 2 -maxdepth 2 -type d | sort | tail -n 1 | xargs basename)

          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

          echo "Latest Run ID: $RUN_ID"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build Docker Model
        shell: bash -el {0}
        run: |

          cd MLProject

          mlflow models build-docker \
            --model-uri "runs:/$RUN_ID/model" \
            --name "apple-quality-model"

      - name: Tag Docker Image
        run: |

          docker tag \
            apple-quality-model \
            ${{ secrets.DOCKER_HUB_USERNAME }}/apple-quality-model:latest

      - name: Push Docker Image
        run: |

          docker push \
          ${{ secrets.DOCKER_HUB_USERNAME }}/apple-quality-model:latest

      - name: Finish Pipeline
        run: |
          echo "=================================="
          echo "Training completed successfully"
          echo "Artifacts uploaded"
          echo "Google Drive uploaded"
          echo "Docker image pushed"
          echo "=================================="